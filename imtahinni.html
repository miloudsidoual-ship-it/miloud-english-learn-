<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>امتحنّي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F4F9;--card:#fff;--ink:#17233B;--mute:#5B687F;--line:#D3DCE8;--acc:#1F4FD8;--accink:#fff;--ok:#0F7B4B;--okbg:#DDF3E8;--bad:#B3261E;--badbg:#FBE1DE;--warn:#FFE08A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101828;--card:#1A2540;--ink:#EAF0FA;--mute:#9FB0CC;--line:#2D3B5C;--acc:#7FA2FF;--accink:#0B1633;--ok:#6EE0A8;--okbg:#12382B;--bad:#FF9A90;--badbg:#45201D;--warn:#5A4A12}}
:root[data-theme="dark"]{--bg:#101828;--card:#1A2540;--ink:#EAF0FA;--mute:#9FB0CC;--line:#2D3B5C;--acc:#7FA2FF;--accink:#0B1633;--ok:#6EE0A8;--okbg:#12382B;--bad:#FF9A90;--badbg:#45201D;--warn:#5A4A12}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.7 Tajawal,"Segoe UI",Tahoma,sans-serif;min-height:100vh}
#app{max-width:640px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:34px;font-weight:800;margin:6px 0 4px}
h2{font-size:21px;font-weight:800;margin:22px 0 10px}
p{margin:0 0 10px;color:var(--mute)}
label{display:block;font-weight:700;margin:14px 0 4px}
select{width:100%;font:inherit;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;background:var(--acc);color:var(--accink)}
button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
button.full{width:100%;margin-top:22px;font-size:18px}
button:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--acc)}
.bar.t i{background:var(--warn);transition:width .25s linear}
.q{font-size:22px;font-weight:700;line-height:1.55;margin:16px 0}
.opt{display:block;width:100%;text-align:start;background:var(--card);color:var(--ink);border:2px solid var(--line);margin-bottom:10px;padding:14px 16px;font-weight:500}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.no{background:var(--badbg);border-color:var(--bad);color:var(--bad);font-weight:700}
.msg{font-weight:700;margin:8px 0}
.score{font-size:56px;font-weight:800;line-height:1.1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.card b{display:block}
.mist .a{color:var(--ok);font-weight:700}
.mist .w{color:var(--bad)}
.tp{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.tp span:first-child{flex:0 0 38%}
.tp .bar{flex:1;margin:0}
.tp .pc{flex:0 0 44px;text-align:end;font-weight:700}
.weak{background:var(--warn);color:var(--ink);border-radius:12px;padding:10px 14px;margin-top:18px}
</style>
</head>
<body>
<div id="app"></div>
<script>
var BANK=[
{s:'الرياضيات',g:'ابتدائي',l:1,t:'الضرب',q:'ما ناتج 7 × 8؟',o:['54','56','48','63'],a:1},
{s:'الرياضيات',g:'ابتدائي',l:1,t:'الكسور',q:'ما ناتج 3/4 + 1/4؟',o:['4/8','1/2','1','3/8'],a:2},
{s:'الرياضيات',g:'ابتدائي',l:2,t:'الهندسة',q:'ما مساحة مستطيل طوله 5 وعرضه 4؟',o:['9','18','20','25'],a:2},
{s:'الرياضيات',g:'ابتدائي',l:2,t:'الضرب',q:'ما ناتج 12 × 11؟',o:['122','132','121','142'],a:1},
{s:'الرياضيات',g:'ابتدائي',l:1,t:'الكسور',q:'أي كسر هو الأكبر؟',o:['1/2','1/4','1/8','1/3'],a:0},
{s:'الرياضيات',g:'إعدادي',l:1,t:'المعادلات',q:'حلّ المعادلة 2x + 6 = 14 هو:',o:['x = 3','x = 4','x = 5','x = 10'],a:1},
{s:'الرياضيات',g:'إعدادي',l:1,t:'الأعداد',q:'ما ناتج (−3) × (−4)؟',o:['−12','−7','12','7'],a:2},
{s:'الرياضيات',g:'إعدادي',l:2,t:'الهندسة',q:'محيط دائرة نصف قطرها 7 (π = 22/7) يساوي:',o:['22','44','154','49'],a:1},
{s:'الرياضيات',g:'إعدادي',l:1,t:'الجذور',q:'ما قيمة √144؟',o:['11','12','14','72'],a:1},
{s:'الرياضيات',g:'إعدادي',l:2,t:'المعادلات',q:'إذا كان 3x − 5 = 16 فإن x تساوي:',o:['7','5','21','11/3'],a:0},
{s:'العلوم',g:'ابتدائي',l:1,t:'الفلك',q:'أقرب كوكب إلى الشمس هو:',o:['الأرض','المريخ','عطارد','زحل'],a:2},
{s:'العلوم',g:'ابتدائي',l:1,t:'الجسم',q:'ما الغاز الذي نحتاجه في التنفس؟',o:['الأكسجين','الهيدروجين','النيتروجين','الهيليوم'],a:0},
{s:'العلوم',g:'ابتدائي',l:2,t:'المادة',q:'عند أي درجة (سلسيوس) يغلي الماء النقي؟',o:['0','50','100','212'],a:2},
{s:'العلوم',g:'ابتدائي',l:1,t:'النبات',q:'أي جزء من النبات يمتص الماء من التربة؟',o:['الأوراق','الجذور','الأزهار','الساق'],a:1},
{s:'العلوم',g:'إعدادي',l:1,t:'الجسم',q:'أي عضو يضخّ الدم في الجسم؟',o:['الكبد','الرئتان','القلب','الكلية'],a:2},
{s:'العلوم',g:'إعدادي',l:2,t:'النبات',q:'ما الغاز الذي ينتجه النبات في البناء الضوئي؟',o:['ثاني أكسيد الكربون','الأكسجين','النيتروجين','الميثان'],a:1},
{s:'العلوم',g:'إعدادي',l:1,t:'الكيمياء',q:'الرمز الكيميائي للماء هو:',o:['CO2','O2','NaCl','H2O'],a:3},
{s:'العلوم',g:'إعدادي',l:2,t:'الفيزياء',q:'وحدة قياس القوة هي:',o:['الجول','النيوتن','الواط','الباسكال'],a:1},
{s:'اللغة العربية',g:'ابتدائي',l:1,t:'الجمع',q:'جمع كلمة «كتاب» هو:',o:['كتابات','كُتُب','كاتبون','مكتبة'],a:1},
{s:'اللغة العربية',g:'ابتدائي',l:1,t:'الأضداد',q:'ضد كلمة «كبير» هو:',o:['طويل','قصير','صغير','واسع'],a:2},
{s:'اللغة العربية',g:'ابتدائي',l:2,t:'الأفعال',q:'ما الفعل في جملة «يلعب الولد في الحديقة»؟',o:['الولد','يلعب','الحديقة','في'],a:1},
{s:'اللغة العربية',g:'إعدادي',l:1,t:'الإعراب',q:'إعراب «الطالبُ» في جملة «نجح الطالبُ»:',o:['مفعول به','مبتدأ','فاعل','خبر'],a:2},
{s:'اللغة العربية',g:'إعدادي',l:1,t:'التثنية',q:'مثنى كلمة «معلّم» في حالة الرفع:',o:['معلّمون','معلّمان','معلّمين','معلّمات'],a:1},
{s:'اللغة العربية',g:'إعدادي',l:2,t:'الإعراب',q:'علامة نصب جمع المذكر السالم:',o:['الواو','الألف','الياء','الفتحة'],a:2}
];
var SK='imtahinni-stats-v1',ST={};
try{ST=JSON.parse(localStorage.getItem(SK)||'{}')||{}}catch(e){ST={}}
function saveST(){try{localStorage.setItem(SK,JSON.stringify(ST))}catch(e){}}
var C={s:'الرياضيات',g:'ابتدائي',l:0,timer:30,n:5},R=null,tick=null;
function h(tag,at){var e=document.createElement(tag);at=at||{};for(var k in at){if(k==='on'){for(var v in at.on)e.addEventListener(v,at.on[v])}else e.setAttribute(k,at[k])}
for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c==null)continue;e.appendChild(typeof c==='string'?document.createTextNode(c):c)}return e}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function sel(label,key,opts,num){var s=h('select',{id:'f'+key});opts.forEach(function(o){var op=h('option',{value:o[0]},o[1]);if(String(o[0])===String(C[key]))op.selected=true;s.appendChild(op)});
s.addEventListener('change',function(){C[key]=num?+s.value:s.value});return h('div',{},h('label',{for:'f'+key},label),s)}
function subjects(){var r=[];BANK.forEach(function(q){if(r.indexOf(q.s)<0)r.push(q.s)});return r}

function setup(){var a=document.getElementById('app');a.textContent='';clearInterval(tick);
a.appendChild(h('h1',{},'امتحنّي'));a.appendChild(h('p',{},'اختبارات قصيرة بتصحيح فوري، وتحليل يريك أين تخطئ.'));
a.appendChild(sel('المادة','s',subjects().map(function(x){return[x,x]})));
a.appendChild(sel('الصف','g',[['ابتدائي','ابتدائي'],['إعدادي','إعدادي']]));
a.appendChild(sel('المستوى','l',[[0,'الكل'],[1,'سهل'],[2,'متوسط']],true));
a.appendChild(sel('وقت كل سؤال','timer',[[0,'بدون مؤقت'],[20,'20 ثانية'],[30,'30 ثانية'],[60,'60 ثانية']],true));
a.appendChild(h('button',{class:'full',on:{click:start}},'ابدأ الاختبار'));
var w=weak();if(w.length)a.appendChild(h('div',{class:'weak'},'نقاط تحتاج مراجعة: '+w.join('، ')))}
function weak(){var r=[];for(var k in ST){var x=ST[k];if(x.n>=2&&x.c/x.n<0.6)r.push(k.split('|')[1]+' ('+k.split('|')[0]+')')}return r.slice(0,4)}

function start(){var pool=BANK.filter(function(q){return q.s===C.s&&q.g===C.g&&(!C.l||q.l===C.l)});
if(!pool.length){alert('لا توجد أسئلة لهذا الاختيار. جرّب مستوى آخر.');return}
var qs=shuf(pool).slice(0,C.n).map(function(q){var idx=shuf([0,1,2,3]);return{s:q.s,t:q.t,q:q.q,o:idx.map(function(i){return q.o[i]}),a:idx.indexOf(q.a),pick:-1}});
R={qs:qs,i:0,left:C.timer,done:false};show()}

function show(){var a=document.getElementById('app');a.textContent='';clearInterval(tick);
var q=R.qs[R.i];R.done=false;R.left=C.timer;
a.appendChild(h('div',{class:'row'},h('b',{},'السؤال '+(R.i+1)+' من '+R.qs.length),h('button',{class:'ghost',on:{click:function(){if(confirm('إنهاء الاختبار؟')){clearInterval(tick);setup()}}}},'إنهاء')));
a.appendChild(h('div',{class:'bar'},h('i',{style:'width:'+(R.i/R.qs.length*100)+'%'})));
var tb=null;if(C.timer){tb=h('i',{style:'width:100%'});a.appendChild(h('div',{class:'bar t','aria-hidden':'true'},tb))}
a.appendChild(h('div',{class:'q'},q.q));
var btns=q.o.map(function(t,i){var b=h('button',{class:'opt',on:{click:function(){answer(i)}}},t);a.appendChild(b);return b});
var fb=h('div',{class:'msg',role:'status'});a.appendChild(fb);
var nx=h('button',{class:'full',style:'display:none',on:{click:function(){if(R.i<R.qs.length-1){R.i++;show()}else result()}}},R.i<R.qs.length-1?'التالي':'عرض النتيجة');a.appendChild(nx);
R.ui={btns:btns,fb:fb,nx:nx};
if(C.timer){var t0=Date.now();tick=setInterval(function(){var l=C.timer-(Date.now()-t0)/1000;tb.style.width=Math.max(0,l/C.timer*100)+'%';if(l<=0)answer(-1)},250)}}

function answer(i){if(R.done)return;R.done=true;clearInterval(tick);var q=R.qs[R.i],u=R.ui;q.pick=i;
u.btns.forEach(function(b,k){b.disabled=true;if(k===q.a)b.classList.add('ok');else if(k===i)b.classList.add('no')});
var key=q.s+'|'+q.t;ST[key]=ST[key]||{c:0,n:0};ST[key].n++;if(i===q.a)ST[key].c++;saveST();
u.fb.textContent=i===q.a?'إجابة صحيحة':i<0?'انتهى الوقت. الصحيح: '+q.o[q.a]:'إجابة خاطئة. الصحيح: '+q.o[q.a];
u.fb.style.color=i===q.a?'var(--ok)':'var(--bad)';u.nx.style.display='block';u.nx.focus()}

function result(){var a=document.getElementById('app');a.textContent='';clearInterval(tick);
var ok=R.qs.filter(function(q){return q.pick===q.a}).length,n=R.qs.length,topics={};
R.qs.forEach(function(q){var x=topics[q.t]=topics[q.t]||{c:0,n:0};x.n++;if(q.pick===q.a)x.c++});
a.appendChild(h('h1',{},'نتيجتك'));a.appendChild(h('div',{class:'score'},ok+' / '+n));
a.appendChild(h('p',{},ok===n?'ممتاز، لا أخطاء.':ok/n>=0.6?'جيد. راجع الأخطاء أدناه.':'تحتاج مراجعة. ابدأ بالأخطاء أدناه.'));
a.appendChild(h('h2',{},'تحليل المواضيع'));
for(var t in topics){var x=topics[t],p=Math.round(x.c/x.n*100);
a.appendChild(h('div',{class:'tp'},h('span',{},t),h('div',{class:'bar'},h('i',{style:'width:'+p+'%;background:'+(p>=60?'var(--ok)':'var(--bad)')})),h('span',{class:'pc'},p+'%')))}
var wr=R.qs.filter(function(q){return q.pick!==q.a});
if(wr.length){a.appendChild(h('h2',{},'أخطاؤك'));wr.forEach(function(q){
a.appendChild(h('div',{class:'card mist'},h('b',{},q.q),h('div',{class:'w'},'إجابتك: '+(q.pick<0?'لم تُجب (انتهى الوقت)':q.o[q.pick])),h('div',{class:'a'},'الصحيح: '+q.o[q.a])))})}
a.appendChild(h('button',{class:'full',on:{click:start}},'اختبار جديد بنفس الإعدادات'));
a.appendChild(h('button',{class:'full ghost',style:'margin-top:10px',on:{click:setup}},'تغيير الإعدادات'))}
setup();
</script>
</body>
</html>
